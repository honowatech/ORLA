name: CI

# Contrôles qualité sur chaque push et pull request : style (Pint),
# analyse statique (Larastan) et tests (PHPUnit).

on:
  push:
    branches-ignore: [preprod]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Style (Pint)
        run: vendor/bin/pint --test

      - name: Analyse statique (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Compilation des vues Blade
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan view:cache

      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit
